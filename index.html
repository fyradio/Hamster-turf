<title>倉鼠圈地</title>
<style>
:root{
  /* Layout: one full-viewport game. DOM screens (title, scenes, collection, results) sit on a mint checker field that echoes the territory grid; a canvas takes over during play. */
  --ink:#2a2438;
  --mint:#93e0bd;
  --mint-2:#84d6b1;
  --pink:#ff5d8f;
  --sun:#ffd23f;
  --sky:#4cc9f0;
  --white:#ffffff;
  --muted:#7b7590;
  --lock:#ddd9e8;
  --font:'Zen Maru Gothic','Chiron GoRound TC','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  --num:'Fredoka','Zen Maru Gothic',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;position:relative;overflow:hidden;background-color:var(--mint-2);
  background-image:conic-gradient(var(--mint) 25%,var(--mint-2) 0 50%,var(--mint) 0 75%,var(--mint-2) 0);
  background-size:56px 56px;color:var(--ink);font-family:var(--font);font-weight:700;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
canvas#glc{position:fixed;left:0;top:0;display:none;pointer-events:none;z-index:1}
canvas#cv{position:fixed;left:0;top:0;display:none;touch-action:none;z-index:2}
.screen{position:absolute;inset:0;display:none;flex-direction:column;gap:14px;padding-inline:16px;padding-block:14px;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;z-index:2}
.screen.on{display:flex}
.card{background:var(--white);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:12px 14px;min-width:0}
.btn{font-size:20px;font-weight:900;border:3px solid var(--ink);background:var(--white);border-radius:16px;padding:12px 18px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.tile:focus-visible,.hc:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
.btn.pri{background:var(--pink);color:var(--white);-webkit-text-stroke:0}
.btn.sun{background:var(--sun)}
.btn.big{font-size:26px;padding:15px 18px}
.btn.sm{font-size:16px;padding:7px 12px;box-shadow:0 3px 0 var(--ink)}
.col{display:flex;flex-direction:column;gap:14px;width:min(100%,340px)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 120px}
.ver{position:absolute;left:16px;top:6px;font-family:var(--num);font-size:13px;opacity:.7}
.head{display:flex;align-items:center;gap:12px}
.head h1{margin:0;font-size:24px;font-weight:900}

/* title */
#s-menu{align-items:center;text-align:center}
.mid{margin-block:auto;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.logo{font-size:60px;line-height:1.05;font-weight:900;color:var(--pink);letter-spacing:.04em;-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.sub{font-family:var(--num);font-weight:600;letter-spacing:.42em;font-size:14px;margin-top:-4px}
.mascot canvas{width:150px;height:150px;animation:bob 1.1s ease-in-out infinite;filter:drop-shadow(0 8px 0 rgba(42,36,56,.25))}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.stat{font-size:15px;line-height:1.5}
.stat b{font-family:var(--num);font-size:18px}

/* scenes */
.seg{display:flex;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--white);box-shadow:0 4px 0 var(--ink)}
.seg button{flex:1;border:0;background:transparent;font-size:17px;font-weight:900;padding:9px 4px;cursor:pointer}
.seg button+button{border-left:3px solid var(--ink)}
.seg button.on{background:var(--sun)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px;padding-bottom:12px}
.tile{background:var(--white);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:0;overflow:hidden;text-align:center;cursor:pointer;min-width:0}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tile .sw{height:26px;border-bottom:3px solid var(--ink);position:relative}
.tile .sw i{position:absolute;right:8px;top:6px;width:12px;height:12px;border-radius:3px;border:2px solid var(--ink)}
.tile .no{font-family:var(--num);font-size:22px;font-weight:700;line-height:1.2;padding-top:4px}
.tile .nm{font-size:13px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{display:block;font-size:11px;color:var(--muted);padding:2px 4px 7px;min-height:14px}
.tile.lock{background:var(--lock);color:var(--muted);box-shadow:none;cursor:default}
.tile.lock .sw{filter:grayscale(1) brightness(.85)}
.tile .win{color:#e07b00}

/* collection */
.prev{display:flex;align-items:center;gap:14px}
.prev canvas{width:96px;height:96px;flex:none}
#prevName{font-size:22px;font-weight:900}
.prev small{color:var(--muted);font-size:13px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-bottom:12px}
.hc{background:var(--white);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:8px 4px;text-align:center;cursor:pointer;min-width:0}
.hc canvas{width:64px;height:64px}
.hc .n{font-size:14px;font-weight:900}
.hc small{display:block;font-size:11px;color:var(--muted);min-height:28px;line-height:1.25;padding:0 2px}
.hc.sel{background:#ffe3ec;border-color:var(--pink);box-shadow:0 4px 0 var(--pink)}
.hc.lock{background:var(--lock);box-shadow:none;cursor:default}
.hc.lock canvas{filter:grayscale(1) brightness(.55)}

/* results */
.res h2{margin:0 0 2px;font-size:34px;font-weight:900;color:var(--pink);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill}
.res .sm2{font-size:14px;color:var(--muted)}
.rk{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;font-size:15px}
.rk.me{background:var(--sun)}
.rk .no{font-family:var(--num);width:18px;text-align:center}
.rk .dot{width:16px;height:16px;border-radius:5px;border:2px solid var(--ink);flex:none}
.rk .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .pc{font-family:var(--num);font-size:16px}
.newbox{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.newbox canvas{width:52px;height:52px}
.badge{background:var(--pink);color:#fff;border-radius:8px;padding:2px 8px;font-size:13px;font-family:var(--num)}

/* pause */
.ov{position:fixed;inset:0;background:rgba(42,36,56,.62);display:none;align-items:center;justify-content:center;z-index:5;padding:16px}
.ov.on{display:flex}
.pm{display:flex;flex-direction:column;gap:14px;width:min(100%,300px);text-align:center}
.pm h2{margin:0;font-size:28px}

<script>
'use strict';
const $=s=>document.querySelector(s);
const VER='v0.3';
const TEST=/test/i.test(location.hash);
const SAVE_KEY='hamsterTurf.save';
const INK='#2a2438';
const FONT="'Zen Maru Gothic','Fredoka','PingFang TC','Noto Sans TC',sans-serif";

/* ---------- save (old saves stay readable: defaults are merged under whatever is stored) ---------- */
function defSave(){return{v:1,plays:0,kills:0,wins:0,hardWins:0,bestPct:0,reach:1,sceneBest:{},ham:'golden',cos:'none',seen:['golden','none'],muted:false,diff:1};}
function loadSave(){const s=defSave();try{const r=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(r&&typeof r==='object')Object.assign(s,r);}catch(e){}return s;}
let save=loadSave();
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

/* ---------- hamsters & costumes ----------
   tint = territory colour, acc = pattern colour, tp = territory pattern id used by the shader,
   pat = pattern painted on the hamster's own fur */
const HAMS=[
{id:'golden',name:'小金',full:'黃金鼠',tint:'#f5a524',acc:'#b86a00',tp:0,body:'#f2b35a',belly:'#ffe7b8',ear:'#f2b35a',pat:'',req:null},
{id:'milktea',name:'奶茶',full:'奶茶鼠',tint:'#c99b78',acc:'#f6e2cd',tp:1,body:'#d9b38c',belly:'#f6e6d2',ear:'#d9b38c',pat:'',req:{s:'plays',n:2}},
{id:'panda',name:'胖達',full:'熊貓鼠',tint:'#3e4756',acc:'#9fa9bb',tp:2,body:'#f6f6f6',belly:'#ffffff',ear:'#2a2438',pat:'panda',req:{s:'plays',n:4}},
{id:'sakura',name:'櫻櫻',full:'櫻花鼠',tint:'#f28db2',acc:'#fff0f6',tp:3,body:'#f7c6d6',belly:'#fff0f4',ear:'#f7c6d6',pat:'',req:{s:'bestPct',n:15}},
{id:'silver',name:'銀狐',full:'銀狐鼠',tint:'#8ea1b5',acc:'#e6eef7',tp:4,body:'#b7c3d0',belly:'#eef2f6',ear:'#8fa0b2',pat:'',req:{s:'plays',n:7}},
{id:'pudding',name:'布丁',full:'布丁鼠',tint:'#e8d44d',acc:'#b9791f',tp:5,body:'#f6e08a',belly:'#fff6cf',ear:'#f6e08a',pat:'pudding',req:{s:'plays',n:10}},
{id:'matcha',name:'抹茶',full:'抹茶鼠',tint:'#7cc66b',acc:'#e1f8cf',tp:6,body:'#a9d78f',belly:'#eaf7db',ear:'#a9d78f',pat:'',req:{s:'bestPct',n:25}},
{id:'calico',name:'三花',full:'三色鼠',tint:'#2fb8a6',acc:'#d3fff6',tp:7,body:'#fbfaf6',belly:'#ffffff',ear:'#e9a25a',pat:'calico',req:{s:'plays',n:15}},
{id:'blueberry',name:'藍莓',full:'藍莓鼠',tint:'#4c8bf5',acc:'#d8e6ff',tp:8,body:'#8aa9f0',belly:'#e3ecff',ear:'#8aa9f0',pat:'',req:{s:'kills',n:15}},
{id:'taro',name:'芋泥',full:'紫芋鼠',tint:'#9b72e0',acc:'#eee3ff',tp:9,body:'#bba2e8',belly:'#efe6ff',ear:'#bba2e8',pat:'',req:{s:'bestPct',n:40}},
{id:'bear',name:'黑熊',full:'黑熊鼠',tint:'#7a4b33',acc:'#e8bf9a',tp:10,body:'#6b4a3a',belly:'#b88b6c',ear:'#6b4a3a',pat:'',req:{s:'wins',n:3}},
{id:'rainbow',name:'彩虹',full:'彩虹鼠',tint:'#f0524f',acc:'#ffe066',tp:11,body:'#fbfaf6',belly:'#ffffff',ear:'#fbfaf6',pat:'rainbow',req:{s:'bestPct',n:60}}
];
const COS=[
{id:'none',name:'素顏',req:null},
{id:'straw',name:'小草帽',req:{s:'plays',n:1}},
{id:'bow',name:'蝴蝶結',req:{s:'plays',n:3}},
{id:'chef',name:'廚師帽',req:{s:'kills',n:5}},
{id:'sunflower',name:'向日葵',req:{s:'bestPct',n:10}},
{id:'bowtie',name:'小領結',req:{s:'plays',n:8}},
{id:'shades',name:'墨鏡',req:{s:'bestPct',n:30}},
{id:'phones',name:'耳機',req:{s:'plays',n:12}},
{id:'pirate',name:'海盜帽',req:{s:'kills',n:30}},
{id:'wizard',name:'魔法帽',req:{s:'bestPct',n:45}},
{id:'crown',name:'皇冠',req:{s:'wins',n:1}},
{id:'helmet',name:'太空盔',req:{s:'hardWins',n:1}}
];
const STAT_LABEL={plays:n=>`遊玩 ${n} 場`,kills:n=>`累計擊倒 ${n} 次`,bestPct:n=>`單局佔地 ${n}%`,wins:n=>`拿下第一名 ${n} 次`,hardWins:n=>`困難模式第一名 ${n} 次`};
const isOpen=it=>TEST||!it.req||(save[it.req.s]||0)>=it.req.n;
const reqText=it=>it.req?STAT_LABEL[it.req.s](it.req.n):'';
const reqProg=it=>it.req?`${Math.min(Math.floor(save[it.req.s]||0),it.req.n)}/${it.req.n}`:'';
const hamById=id=>HAMS.find(h=>h.id===id)||HAMS[0];
const cosById=id=>COS.find(c=>c.id===id)||COS[0];

/* ---------- 2.5D sprites: shaded 'clay' hamsters, three views (front / back / side), drawn once ---------- */
const spriteCache={};
function getSprite(hid,cid,view){
  view=view||'f';
  const k=hid+'|'+cid+'|'+view;if(spriteCache[k])return spriteCache[k];
  const c=document.createElement('canvas');c.width=c.height=128;
  const g=c.getContext('2d');g.scale(1.28,1.28);
  paintHam(g,hamById(hid),cid,view);
  return spriteCache[k]=c;
}
function paintHam(g,h,cid,view){
  const OUT='rgba(70,36,76,.5)';
  g.lineJoin='round';g.lineCap='round';
  const T=c=>[c,mix(c,'#ffffff',.55),mix(c,'#2a1850',.4)];
  const blob=(x,y,rx,ry,t,line)=>{
    g.save();g.translate(x,y);g.scale(1,ry/rx);
    const gr=g.createRadialGradient(-rx*.3,-rx*.38,rx*.08,0,0,rx*1.06);
    gr.addColorStop(0,t[1]);gr.addColorStop(.5,t[0]);gr.addColorStop(1,t[2]);
    g.beginPath();g.arc(0,0,rx,0,7);g.fillStyle=gr;g.fill();
    if(line){g.lineWidth=1.8;g.strokeStyle=OUT;g.stroke();}
    g.restore();
  };
  const flat=(x,y,rx,ry,col)=>{g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fillStyle=col;g.fill();};
  const panda=h.pat==='panda';
  const bodyT=T(h.body),earT=T(h.ear),bellyT=T(h.belly);
  const pink='rgba(244,166,168,1)',blush='rgba(255,120,150,.5)';
  const shape=(cx,cy,rx,ry)=>{g.beginPath();g.ellipse(cx,cy,rx,ry,0,0,7);};
  const patterns=(cx,cy)=>{
    if(!h.pat||panda)return;
    g.save();shape(cx,cy,view==='s'?36:39,view==='s'?32:35);g.clip();
    if(h.pat==='calico'){g.fillStyle='#ee9b4a';g.beginPath();g.arc(cx-28,cy-24,22,0,7);g.fill();g.fillStyle='#8a5a3b';g.beginPath();g.arc(cx+32,cy-28,17,0,7);g.fill();}
    if(h.pat==='pudding'){g.fillStyle='#c58a3e';g.beginPath();g.ellipse(cx,cy-34,34,15,0,0,7);g.fill();}
    if(h.pat==='rainbow'){['#ff5d6c','#ffa94d','#ffe066','#69db7c','#4dabf7'].forEach((c,i)=>{g.fillStyle=c;g.fillRect(0,cy-35+i*5,100,5.2);});}
    g.restore();
  };
  const shade=(cx,cy,rx,ry)=>{
    g.save();shape(cx,cy,rx,ry);g.clip();
    const gr=g.createRadialGradient(cx-rx*.35,cy-ry*.55,rx*.05,cx,cy+ry*.1,rx*1.15);
    gr.addColorStop(0,'rgba(255,255,255,.55)');gr.addColorStop(.35,'rgba(255,255,255,0)');
    gr.addColorStop(.7,'rgba(40,10,70,0)');gr.addColorStop(1,'rgba(40,10,70,.42)');
    g.fillStyle=gr;g.fillRect(0,0,100,100);g.restore();
    shape(cx,cy,rx,ry);g.lineWidth=1.8;g.strokeStyle=OUT;g.stroke();
    g.save();shape(cx,cy,rx-1.6,ry-1.6);g.lineWidth=2.2;g.strokeStyle='rgba(255,255,255,.28)';g.stroke();g.restore();
    g.save();g.translate(cx-rx*.36,cy-ry*.5);g.rotate(-.5);g.beginPath();g.ellipse(0,0,rx*.26,ry*.13,0,0,7);g.fillStyle='rgba(255,255,255,.55)';g.fill();g.restore();
  };
  const eye=(x,y,r)=>{
    r*=1.28;g.save();g.translate(x,y);g.scale(1,1.14);
    const gr=g.createRadialGradient(0,r*.35,r*.1,0,0,r);gr.addColorStop(0,'#7a4a5e');gr.addColorStop(.45,'#2a1c33');gr.addColorStop(1,'#1a1224');
    g.beginPath();g.arc(0,0,r,0,7);g.fillStyle=gr;g.fill();g.restore();
    flat(x+r*.3,y-r*.42,r*.42,r*.46,'#fff');flat(x-r*.34,y+r*.38,r*.2,r*.2,'rgba(255,255,255,.85)');
  };
  const noseT=['#ff8fa3','#ffc2cd','#d94f6f'];
  if(view==='f'){
    blob(27,26,11.5,11.5,earT,1);blob(73,26,11.5,11.5,earT,1);
    flat(27,27.5,6,6,panda?'#4a4560':pink);flat(73,27.5,6,6,panda?'#4a4560':pink);
    shape(50,61,41,36);g.fillStyle=h.body;g.fill();patterns(50,61);
    if(panda){g.fillStyle=INK;g.beginPath();g.ellipse(32,54,10,12,-.35,0,7);g.fill();g.beginPath();g.ellipse(68,54,10,12,.35,0,7);g.fill();}
    shade(50,61,41,36);
    blob(50,74,22,15,bellyT,0);
    blob(34,92,9,6,bodyT,1);blob(66,92,9,6,bodyT,1);
    flat(20,68,9,6.5,'rgba(255,110,140,.55)');flat(80,68,9,6.5,'rgba(255,110,140,.55)');
    eye(33,55,5);eye(67,55,5);
    blob(50,63,3.2,2.5,noseT,0);
    g.lineWidth=2;g.strokeStyle=INK;g.lineWidth=1.8;g.beginPath();g.arc(46.8,66,3.2,.1*Math.PI,.9*Math.PI);g.stroke();g.beginPath();g.arc(53.2,66,3.2,.1*Math.PI,.9*Math.PI);g.stroke();
    g.lineWidth=1.6;g.strokeStyle='rgba(42,36,56,.45)';g.beginPath();
    g.moveTo(16,61);g.lineTo(5,58);g.moveTo(16,65);g.lineTo(5,66);g.moveTo(84,61);g.lineTo(95,58);g.moveTo(84,65);g.lineTo(95,66);g.stroke();
  }else if(view==='b'){
    const eb=T(mix(h.ear,'#2a1850',.12));
    blob(27,26,11.5,11.5,eb,1);blob(73,26,11.5,11.5,eb,1);
    shape(50,60,39,35);g.fillStyle=h.body;g.fill();patterns(50,60);
    if(!panda&&!h.pat){g.strokeStyle='rgba(90,50,20,.22)';g.lineWidth=5;g.beginPath();g.moveTo(50,30);g.lineTo(50,86);g.stroke();}
    shade(50,60,39,35);
    blob(36,92,10,6,bodyT,1);blob(64,92,10,6,bodyT,1);
    blob(50,94,6,4.5,bellyT,1);
  }else{
    const eb=T(mix(h.ear,'#2a1850',.2));
    blob(62,28,9,9,eb,1);
    shape(55,62,36,32);g.fillStyle=h.body;g.fill();patterns(55,62);
    if(panda){g.fillStyle=INK;g.beginPath();g.ellipse(29,52,8,10,-.2,0,7);g.fill();}
    shade(55,62,36,32);
    blob(43,27,11,11,earT,1);flat(43,28.5,5.5,5.5,panda?'#4a4560':pink);
    blob(44,77,19,13,bellyT,0);
    blob(33,92,9,6,bodyT,1);blob(61,92,10,6,bodyT,1);
    blob(90,75,5,5,bellyT,1);
    flat(28,68,8,6,blush);
    eye(29,54,4.8);
    blob(14,60,4.2,3.4,noseT,1);
    g.lineWidth=2;g.strokeStyle=INK;g.beginPath();g.moveTo(17,66);g.lineTo(25,66);g.stroke();
    g.lineWidth=1.6;g.strokeStyle='rgba(42,36,56,.45)';g.beginPath();g.moveTo(22,62);g.lineTo(8,58);g.moveTo(22,66);g.lineTo(8,69);g.stroke();
  }
  paintCos(g,cid,view);
}
function paintCos(g,id,view){
  const poly=(pts,f)=>{g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fillStyle=f;g.fill();g.stroke();};
  const ell=(x,y,rx,ry,f,rot)=>{g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,7);g.fillStyle=f;g.fill();g.stroke();};
  g.save();g.strokeStyle=INK;g.lineWidth=3;g.lineJoin='round';
  const head=['straw','bow','chef','sunflower','pirate','wizard','crown'].indexOf(id)>=0;
  if(head&&view==='s')g.translate(-8,0);
  switch(id){
  case 'straw':
    ell(50,27,36,8,'#e8c26a');
    g.beginPath();g.moveTo(31,26);g.bezierCurveTo(31,2,69,2,69,26);g.closePath();g.fillStyle='#f3d27f';g.fill();g.stroke();
    g.fillStyle='#e5484d';g.fillRect(32,19,36,6);break;
  case 'bow':
    poly([[30,19],[12,8],[12,30]],'#ff7aa8');poly([[30,19],[48,8],[48,30]],'#ff7aa8');ell(30,19,5.5,5.5,'#e0457f');break;
  case 'chef':
    ell(35,14,10,10,'#fff');ell(50,10,12,12,'#fff');ell(65,14,10,10,'#fff');
    g.beginPath();g.rect(33,19,34,12);g.fillStyle='#fff';g.fill();g.stroke();break;
  case 'sunflower':
    for(let i=0;i<8;i++){const a=i*Math.PI/4;ell(72+Math.cos(a)*9,18+Math.sin(a)*9,6,3.6,'#ffd23f',a);}
    ell(72,18,6,6,'#8a5a2b');break;
  case 'bowtie':
    if(view==='b')break;
    if(view==='s'){g.translate(-14,3);}
    poly([[50,82],[32,72],[32,92]],'#ff4d6d');poly([[50,82],[68,72],[68,92]],'#ff4d6d');ell(50,82,4.5,4.5,'#c9184a');break;
  case 'shades':
    if(view==='b')break;
    if(view==='s'){ell(29,52,9,8,INK);g.beginPath();g.moveTo(37,50);g.lineTo(52,47);g.stroke();break;}
    ell(35,51,13,9,INK);ell(65,51,13,9,INK);
    g.beginPath();g.moveTo(47,49);g.lineTo(53,49);g.stroke();
    g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=2;g.beginPath();g.moveTo(28,48);g.lineTo(34,46);g.moveTo(58,48);g.lineTo(64,46);g.stroke();break;
  case 'phones':
    g.lineWidth=5;g.strokeStyle='#3b3552';g.beginPath();
    if(view==='s')g.arc(54,58,38,Math.PI*1.1,Math.PI*1.9);else g.arc(50,56,40,Math.PI*1.1,Math.PI*1.9);
    g.stroke();g.lineWidth=3;g.strokeStyle=INK;
    if(view==='s')ell(46,54,7,11,'#ff5d8f');else{ell(11,54,7,11,'#ff5d8f');ell(89,54,7,11,'#ff5d8f');}
    break;
  case 'pirate':
    poly([[16,30],[26,10],[50,3],[74,10],[84,30],[50,22]],'#2f2b3f');
    g.beginPath();g.arc(50,14,5,0,7);g.fillStyle='#fff';g.fill();
    g.fillStyle=INK;g.fillRect(47.5,12,1.8,2.4);g.fillRect(51,12,1.8,2.4);break;
  case 'wizard':

  case 3:for(let y=12;y<H-8;y+=11)for(let x=((y/11|0)%2?12:7);x<W-6;x+=11)rect(x,y,2,2);break;
  case 4:for(let y=14;y<H-12;y+=14){const g=ri(8,W-18);rect(4,y,g-4,2);rect(g+10,y,W-g-14,2);}break;

  case 7:for(let t=0;t<=1.001;t+=.1){const x=(8+(W-20)*t)|0,y=(8+(H-20)*t)|0;rect(x,y,3,3);rect(W-x-3,y,3,3);}break;
  case 8:rect(6,H>>1,(W>>1)-10,2);rect((W>>1)+6,H>>1,(W>>1)-12,2);rect(W>>1,6,2,(H>>1)-10);rect(W>>1,(H>>1)+6,2,(H>>1)-12);break;
  case 9:for(let gy=10;gy<H-10;gy+=12)for(let gx=10;gx<W-10;gx+=12){if(r()<.18)continue;if(r()<.5)rect(gx,gy,ri(4,6),2);else rect(gx,gy,2,ri(4,6));}break;

}

function areaFree(cx,cy,r){
  const g=G,{W,H}=g;
  for(let dy=-r;dy<=r;dy+=1){for(let dx=-r;dx<=r;dx+=1){
    if(dx*dx+dy*dy>r*r)continue;
    const x=cx+dx,y=cy+dy;
    if(x<1.5||y<1.5||x>W-1.5||y>H-1.5)return false;
    if(isWall(x,y))return false;
    const i=ci(x,y);if(g.owner[i]||g.trailO[i])return false;
  }}
  return true;
}
function placeEnt(e,first){
  const g=G,{W,H,ents}=g;let pos=null;
  for(let n=0;n<600&&!pos;n++){
    let x,y;
    if(first&&e.isP){x=W/2+(Math.random()*8-4);y=H-10-Math.random()*3;}
    else{x=5+Math.random()*(W-10);y=5+Math.random()*(H-10);}
    if(!areaFree(x,y,n<400?3.6:2.4))continue;
    let ok=true;
    for(const o of ents){if(o!==e&&o.alive&&Math.hypot(o.x-x,o.y-y)<(n<250?16:8)){ok=false;break;}}
    if(ok)pos=[x,y];
  }
  if(!pos){pos=[W/2,H/2];for(let j=-4;j<=4;j++)for(let i=-4;i<=4;i++){const xx=(W/2|0)+i,yy=(H/2|0)+j;if(xx>0&&yy>0&&xx<W-1&&yy<H-1){g.wall[yy*W+xx]=0;for(let b=0;b<K*K;b++)g.wallF[(yy*K+(b>>1))*g.GW+xx*K+(b&1)]=0;}}}
  const [x,y]=pos,R=3.0;
  const x0=Math.max(0,((x-R)*K)|0),x1=Math.min(g.GW-1,((x+R)*K)|0),y0=Math.max(0,((y-R)*K)|0),y1=Math.min(g.GH-1,((y+R)*K)|0);
  for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++){
    const dx=(xx+.5)/K-x,dy=(yy+.5)/K-y;
    if(dx*dx+dy*dy<=R*R){const i=yy*g.GW+xx;if(!g.wallF[i])setOwner(i,e.id);}
  }
  e.x=e.px=e.lx=x;e.y=e.py=e.ly=y;
  e.ang=(first&&e.isP)?-Math.PI/2:Math.atan2(H/2-y,W/2-x);e.tang=e.ang;
  e.alive=true;e.trail=[];e.tcells=[];e.tl=0;e.seq=1;e.shield=0;e.shT=0;e.speedT=0;e.magT=0;
  if(e.ai){e.ai.mode='idle';e.ai.plan=[];e.ai.target=null;}

function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=1.5+Math.random()*4;G.parts.push({x,y,z:.3,vx:Math.cos(a)*s,vy:Math.sin(a)*s,vz:2+Math.random()*4,l:.6+Math.random()*.5,m:1.1,c});}}

/* ---------- trails ---------- */
function stampTrail(e,x,y){
  const g=G,r=.42,R2=r*r,GW=g.GW;
  const x0=Math.max(0,((x-r)*K)|0),x1=Math.min(GW-1,((x+r)*K)|0),y0=Math.max(0,((y-r)*K)|0),y1=Math.min(g.GH-1,((y+r)*K)|0);
  for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++){
    const dx=(xx+.5)/K-x,dy=(yy+.5)/K-y;
    if(dx*dx+dy*dy>R2)continue;
    const i=yy*GW+xx;
    if(g.wallF[i])continue;
    const t=g.trailO[i];
    if(t===0){e.tcells.push(i);g.trailO[i]=e.id;g.trailS[i]=e.seq;}
    else if(t===e.id){g.trailS[i]=e.seq;}
  }
  e.seq++;
}
function clearTrail(v){
  const g=G;
  for(const i of v.tcells)if(g.trailO[i]===v.id){g.trailO[i]=0;g.trailS[i]=0;}
  v.tcells=[];v.trail=[];v.tl=0;
}

/* ---------- movement ---------- */
function moveSub(e,dt){
  const g=G,{W,H}=g;
  let da=angDiff(e.tang,e.ang);const mt=e.turn*dt;
  if(da>mt)da=mt;else if(da<-mt)da=-mt;
  e.ang+=da;
  const sp=speedOf(e);
  let nx=e.x+Math.cos(e.ang)*sp*dt,ny=e.y+Math.sin(e.ang)*sp*dt;
  if(nx<.7)nx=.7;else if(nx>W-.7)nx=W-.7;
  if(ny<.7)ny=.7;else if(ny>H-.7)ny=H-.7;
  if(isWall(nx,e.y))nx=e.x;
  if(isWall(nx,ny))ny=e.y;
  e.px=e.x;e.py=e.y;e.x=nx;e.y=ny;
  const home=g.owner[ci(e.x,e.y)]===e.id;
  if(home){e.lx=e.x;e.ly=e.y;}
  const hx=e.x+Math.cos(e.ang)*.35,hy=e.y+Math.sin(e.ang)*.35,hi=ci(hx,hy),to=g.trailO[hi];
  if(to){
    if(to!==e.id){const v=g.ents[to-1];if(v.alive)kill(v,e);}
    else if(!home&&e.seq-g.trailS[hi]>GRACE){if(kill(e,null))return;}
  }
  if(!home){
    if(e.trail.length===0){e.trail.push(e.lx,e.ly);e.tx=e.lx;e.ty=e.ly;e.tl=0;stampTrail(e,e.lx,e.ly);}
    const dx=e.x-e.tx,dy=e.y-e.ty;
    if(dx*dx+dy*dy>=.09){e.trail.push(e.x,e.y);e.tl+=Math.sqrt(dx*dx+dy*dy);e.tx=e.x;e.ty=e.y;stampTrail(e,e.x,e.y);}
  }else if(e.trail.length){
    stampTrail(e,e.x,e.y);closeLoop(e);
  }
}

function kill(v,k){
  if(!v.alive)return false;
  if(v.invT>0)return false;
  if(v.shield>0){v.shield=0;v.shT=0;v.invT=1.4;burst(v.x,v.y,'#4cc9f0',26);burst(v.x,v.y,'#ffffff',10);G.rips.push({x:v.x,y:v.y,t:0});if(v.isP)toast('護盾擋住了！','#9be7ff');return false;}
  const g=G,{owner,N}=g;
  v.alive=false;clearTrail(v);
  const heir=(k&&k!==v&&k.alive)?k.id:0;let got=0;
  for(let i=0;i<N;i++)if(owner[i]===v.id){setOwner(i,heir);got++;}
  if(heir&&got>20){burst(k.x,k.y,k.c.fill,20);g.rips.push({x:v.x,y:v.y,t:0,c:k.c.fill});if(k.isP){pop(k.x,k.y-1,'+'+(got/g.playable*100).toFixed(1)+'%','#fff');}const p=pct(k);if(p>k.peak)k.peak=p;}
  burst(v.x,v.y,v.c.fill,26);
  v.respT=v.isP?2:3;v.deaths++;
  if(k&&k!==v){
    k.kills++;
    if(k.isP){sfx.kill();toast('擊倒了 '+v.name+'！','#ffe066');onPlayerKill();}
    else if(v.isP)toast('被 '+k.name+' 擊倒了','#ff9fb8');
  }else if(v.isP)toast('撞到自己的尾巴了','#ff9fb8');
  if(v.isP)sfx.die();
  return true;
}

function closeLoop(e){
  const g=G,{GW,GH,N,owner,trailO,wallF,vis,stack,ents}=g;
  const n=e.tcells.length;
  for(const i of e.tcells){if(trailO[i]===e.id){trailO[i]=0;g.trailS[i]=0;}if(!wallF[i]&&owner[i]!==e.id)setOwner(i,e.id);}
  e.tcells=[];e.trail=[];e.tl=0;
  if(e.ai){e.ai.mode='idle';e.ai.plan=[];}
  if(n<8)return;
  vis.fill(0);let sp=0;
  const P=i=>{if(!vis[i]&&owner[i]!==e.id){vis[i]=1;stack[sp++]=i;}};
  for(let x=0;x<GW;x++){P(x);P(N-GW+x);}
  for(let y=0;y<GH;y++){P(y*GW);P(y*GW+GW-1);}
  while(sp){const i=stack[--sp],x=i%GW;if(x>0)P(i-1);if(x<GW-1)P(i+1);if(i>=GW)P(i-GW);if(i<N-GW)P(i+GW);}
  const heads=new Map();
  for(const o of ents)if(o!==e&&o.alive)heads.set(ci(o.x,o.y),o);
  const dead=new Set();let gained=n;
  for(let i=0;i<N;i++){
    if(vis[i]||owner[i]===e.id||wallF[i])continue;
    setOwner(i,e.id);gained++;
    const t=trailO[i];if(t&&t!==e.id)dead.add(ents[t-1]);
    const h=heads.get(i);if(h)dead.add(h);
  }
  for(const v of dead){if(!kill(v,e))clearTrail(v);}
  if(gained>20){
    burst(e.x,e.y,e.c.fill,Math.min(30,8+(gained/60|0)));
    g.rips.push({x:e.x,y:e.y,t:0,c:e.c.fill});
    if(e.isP){sfx.cap();pop(e.x,e.y-1,'+'+(gained/g.playable*100).toFixed(1)+'%','#fff');}
  }
  const p=pct(e);if(p>e.peak)e.peak=p;
  if(e.isP&&p>=67&&!g.eggP){g.eggP=true;egg();}
}

/* ---------- main update ---------- */
function respawn(e){placeEnt(e,false);e.invT=2;}

function update(dt){
  const g=G;g.t+=dt;
  if(g.state==='count'){
    g.cd-=dt;const c=Math.ceil(g.cd);
    if(c<g.lastCd){g.lastCd=c;if(c>=1&&c<=3)sfx.tick();}
    if(g.cd<=0){g.state='play';sfx.go();}
    return;
  }
  if(g.state==='over'){g.overT-=dt;fxUpdate(dt);if(g.overT<=0)finishGame();return;}
  g.left-=dt;
  if(g.left<=0){g.left=0;g.state='over';g.overT=1.6;sfx.end();return;}
  if(g.combo.t>0)g.combo.t-=dt;
  for(const e of g.ents){
    if(!e.alive){e.respT-=dt;if(e.respT<=0)respawn(e);continue;}
    e.invT=Math.max(0,e.invT-dt);
    if(e.speedT>0)e.speedT-=dt;if(e.magT>0)e.magT-=dt;
    if(e.shield>0){e.shT-=dt;if(e.shT<=0)e.shield=0;}
    if(e.ai)aiThink(e,dt);
    const n=Math.max(1,Math.ceil(speedOf(e)*dt/.15)),sd=dt/n;
    for(let s=0;s<n;s++){moveSub(e,sd);if(!e.alive)break;}
    if(!e.alive)continue;
    e.phase+=dt*speedOf(e)*1.6;
    const p=pct(e);if(p>e.peak)e.peak=p;
  }
  g.itemT-=dt;
  if(g.itemT<=0){g.itemT=2.5+Math.random()*2;if(g.items.length<5+(g.playable/(900*K*K)|0))spawnItem();}
  for(const e of g.ents){
    if(!e.alive)continue;
    for(let k=g.items.length-1;k>=0;k--){
      const it=g.items[k];
      if(e.magT>0){const dx=e.x-it.x,dy=e.y-it.y,d=Math.hypot(dx,dy);if(d<MAG_R&&d>.01){const m=Math.min(d,(7+(MAG_R-d)*1.6)*dt*2);it.x+=dx/d*m;it.y+=dy/d*m;}}
      if(Math.abs(it.x-e.x)<1.2&&Math.abs(it.y-e.y)<1.2)pickup(e,it);
    }
  }
  fxUpdate(dt);
  g.mmT-=dt;if(g.mmT<=0){g.mmT=.5;mmUpdate();}
}
function fxUpdate(dt){
  const g=G;
  for(let i=g.parts.length-1;i>=0;i--){const p=g.parts[i];p.l-=dt;if(p.l<=0){g.parts.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=11*dt;if(p.z<0){p.z=0;p.vz*=-.4;}p.vx*=.95;p.vy*=.95;}
  for(let i=g.pops.length-1;i>=0;i--){const p=g.pops[i];p.t+=dt;if(p.t>1.3)g.pops.splice(i,1);}
  for(let i=g.rips.length-1;i>=0;i--){const p=g.rips[i];p.t+=dt;if(p.t>.9)g.rips.splice(i,1);}
  for(let i=g.toasts.length-1;i>=0;i--){const t=g.toasts[i];t.t+=dt;if(t.t>2.6)g.toasts.splice(i,1);}
  if(g.egg){g.egg.t+=dt;if(g.egg.t>2.4)g.egg=null;}
  if(g.big){g.big.t+=dt;if(g.big.t>1.6)g.big=null;}
}

/* ================= camera: a ball seen from just above & behind the player =================

   The ball is drawn per-pixel in a fragment shader; sprites are projected with the same maths. */

let VW=0,VH=0,DPR=1;

function camSetup(){
  const R=CAMP.R,b=CAMP.beta,L=CAMP.L;
  const D=R*Math.cos(b)+Math.sqrt(L*L-R*R*Math.sin(b)*Math.sin(b));
  const C=[0,D*Math.sin(b),D*Math.cos(b)];
  let f=[-C[0],-C[1],R-C[2]];const fl=Math.hypot(f[0],f[1],f[2]);f=[f[0]/fl,f[1]/fl,f[2]/fl];
  const dp=-f[1];let u=[-f[0]*dp,-1-f[1]*dp,-f[2]*dp];const ul=Math.hypot(u[0],u[1],u[2]);u=[u[0]/ul,u[1]/ul,u[2]/ul];
  const cell=Math.min(VW/17,VH/33);
  CM={C,f,u,r:[1,0,0],R,Fp:cell*fl,ppx:VW/2,ppy:VH*CAMP.ppy,cell};
}
function project(wx,wy,h){
  const g=G,fx=g.cam.x,fy=g.cam.y;h=h||0;
  if(!useGL){const S=CM.cell;PR.x=VW/2+(wx-fx)*S;PR.y=VH*CAMP.ppy+(wy-fy)*S-h*S;PR.s=S;PR.v=true;return PR;}
  const R=CM.R,lon=(wx-fx)/R,lat=(wy-fy)/R;
  if(Math.abs(lon)>1.3||Math.abs(lat)>1.3){PR.v=false;return PR;}
  const cl=Math.cos(lat),k=1+h/R,px=R*cl*Math.sin(lon)*k,py=R*Math.sin(lat)*k,pz=R*cl*Math.cos(lon)*k,C=CM.C,f=CM.f,u=CM.u;
  const dx=px-C[0],dy=py-C[1],dz=pz-C[2],zc=dx*f[0]+dy*f[1]+dz*f[2];
  if(zc<1){PR.v=false;return PR;}
  PR.x=CM.ppx+CM.Fp*dx/zc;PR.y=CM.ppy-CM.Fp*(dx*u[0]+dy*u[1]+dz*u[2])/zc;PR.s=CM.Fp/zc;
  PR.v=(px*(C[0]-px)+py*(C[1]-py)+pz*(C[2]-pz))>0;

}

const VSRC='attribute vec2 aPos;void main(){gl_Position=vec4(aPos,0.0,1.0);}';

#else

#endif

uniform float uFp;uniform vec2 uPP;uniform float uR;
uniform vec2 uFocus;uniform vec2 uWin;uniform vec2 uMap;uniform vec2 uFine;uniform float uTime;
uniform sampler2D uDyn;uniform sampler2D uFA;uniform sampler2D uFB;

float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}

float pattern(float id,vec2 p){

  if(id<1.5){float s=abs(fract((p.x+p.y)*0.26)-0.5);return 1.0-smoothstep(0.10,0.17,s);}
  if(id<2.5){vec2 q=floor(p*0.45);return mod(q.x+q.y,2.0);}
  if(id<3.5){g=fract(p*0.4)-0.5;r=length(g);float a=atan(g.y,g.x);float pet=0.15+0.09*cos(5.0*a);return 1.0-smoothstep(pet-0.02,pet+0.02,r);}

  if(id<5.5){g=fract(p*0.42)-0.5;r=length(g);return smoothstep(0.09,0.13,r)*(1.0-smoothstep(0.19,0.23,r));}
  if(id<6.5){float z=abs(fract(p.x*0.3)-0.5)*2.0;float s=abs(fract(p.y*0.3+z*0.3)-0.5);return 1.0-smoothstep(0.07,0.14,s);}

    g=fract(p*0.3)-0.5;

    a=max(a,1.0-smoothstep(0.06,0.09,length(g-vec2(-0.17,-0.07))));
    a=max(a,1.0-smoothstep(0.06,0.09,length(g-vec2(-0.06,-0.17))));
    a=max(a,1.0-smoothstep(0.06,0.09,length(g-vec2(0.06,-0.17))));

vec3 space(vec2 px,vec3 d){

void main(){

}`;

/* ---------- AI (free-angle steering) ---------- */
function blockedAt(e,x,y){
  const g=G;
  if(x<1.2||y<1.2||x>g.W-1.2||y>g.H-1.2||isWall(x,y))return true;
  const i=ci(x,y);return g.trailO[i]===e.id&&e.seq-g.trailS[i]>GRACE;
}
function freeDist(e,ang,max){
  const cs=Math.cos(ang),sn=Math.sin(ang);
  for(let d=.9;d<=max;d+=.9){
    if(blockedAt(e,e.x+cs*d,e.y+sn*d))return d;
    if(d>=1.8&&(blockedAt(e,e.x+cs*d-sn*.8,e.y+sn*d+cs*.8)||blockedAt(e,e.x+cs*d+sn*.8,e.y+sn*d-cs*.8)))return d*.8;
  }
  return max;
}
const STEER_OFFS=[0,.45,-.45,.9,-.9,1.4,-1.4,2.0,-2.0,2.8];
function steer(e,want){
  let best=want,bd=-1;
  for(const o of STEER_OFFS){const a=want+o,fd=freeDist(e,a,7);if(fd>=7)return a;if(fd>bd){bd=fd;best=a;}}
  return best;
}
function nearestOwn(e){
  const A=e.ai,g=G;
  if(A.home&&g.t-A.homeT<.35)return A.home;
  const gx=(e.x*K)|0,gy=(e.y*K)|0,R=36;let bd=1e9,bx=-1,by=-1;
  const scan=(x0,x1,y0,y1,st)=>{for(let y=y0;y<=y1;y+=st)for(let x=x0;x<=x1;x+=st){if(g.owner[y*g.GW+x]===e.id){const d=(x-gx)*(x-gx)+(y-gy)*(y-gy);if(d<bd){bd=d;bx=x;by=y;}}}};
  scan(Math.max(0,gx-R),Math.min(g.GW-1,gx+R),Math.max(0,gy-R),Math.min(g.GH-1,gy+R),2);
  if(bx<0)scan(0,g.GW-1,0,g.GH-1,3);
  A.home=bx<0?null:{x:(bx+.5)/K,y:(by+.5)/K};A.homeT=g.t;
  return A.home;
}
function danger(e){
  const r=G.D.aware;if(!r||e.tl<3)return false;
  for(const o of G.ents){
    if(o===e||!o.alive)continue;
    if(Math.hypot(o.x-e.x,o.y-e.y)<r)return true;
    for(let i=0;i<e.trail.length;i+=6)if(Math.hypot(o.x-e.trail[i],o.y-e.trail[i+1])<r)return true;
  }
  return false;
}
function nearestEnemyTrail(e,R){
  let bd=R,best=null;
  for(const o of G.ents){
    if(o===e||!o.alive)continue;
    for(let i=0;i<o.trail.length;i+=4){const d=Math.hypot(o.trail[i]-e.x,o.trail[i+1]-e.y);if(d<bd){bd=d;best={x:o.trail[i],y:o.trail[i+1]};}}
  }
  return best;
}
function makePlan(e){
  const A=e.ai,P=A.p,sc=G.D.sc,g=G;
  let best=e.ang,bs=-1;
  const toC=Math.atan2(g.H/2-e.y,g.W/2-e.x);
  for(let k=0;k<12;k++){
    const a=Math.random()*6.283,s=freeDist(e,a,22)+4*Math.cos(a-toC)+Math.random()*5;
    if(s>bs){bs=s;best=a;}
  }
  const len=v=>(v[0]+Math.random()*(v[1]-v[0]))*sc;
  const a=len(P.a),b=len(P.b),side=Math.random()<.5?1:-1,a1=best+side*Math.PI/2;
  const cl=(x,y)=>{let p={x:Math.max(1.8,Math.min(g.W-1.8,x)),y:Math.max(1.8,Math.min(g.H-1.8,y))},n=0;
    while(isWall(p.x,p.y)&&n++<8){p.x=e.x+(p.x-e.x)*.8;p.y=e.y+(p.y-e.y)*.8;}return p;};
  const p1=cl(e.x+Math.cos(best)*a,e.y+Math.sin(best)*a);
  const p2=cl(p1.x+Math.cos(a1)*b,p1.y+Math.sin(a1)*b);
  const p3=cl(p2.x-Math.cos(best)*a,p2.y-Math.sin(best)*a);
  A.plan=[p1,p2,p3];A.mode='plan';A.planT=g.t;
}
function aiThink(e,dt){
  const A=e.ai,P=A.p,g=G;
  A.t+=dt;if(A.t<.09)return;A.t=0;
  const home=g.owner[ci(e.x,e.y)]===e.id;
  if(home&&e.trail.length===0&&(A.mode!=='plan'||A.plan.length===0))makePlan(e);
  if(!home||e.trail.length>0){
    if(e.tl>P.maxTrail)A.mode='return';
    else if(A.mode!=='return'&&danger(e))A.mode='return';
    else if(P.hunter&&A.mode!=='return'){
      if(e.tl<=P.safe&&g.t>(A.huntBan||0)){const t=nearestEnemyTrail(e,16);if(t){A.mode='hunt';A.target=t;}else if(A.mode==='hunt')A.mode='return';}
      else if(A.mode==='hunt')A.mode='return';
    }
    if(A.mode==='plan'&&g.t-A.planT>14)A.mode='return';
  }
  let tx,ty;
  if(A.mode==='plan'){
    let wp=A.plan[0];
    while(wp&&Math.hypot(wp.x-e.x,wp.y-e.y)<1.5){A.plan.shift();wp=A.plan[0];}
    if(wp){tx=wp.x;ty=wp.y;}else A.mode='return';
  }
  if(A.mode==='hunt'){
    tx=A.target.x;ty=A.target.y;
    const ha=Math.atan2(ty-e.y,tx-e.x);let dd=Math.abs(((ha-e.ang)%6.2832+9.4248)%6.2832-3.1416);dd=3.1416-dd;
    if(dd>1.7||freeDist(e,ha,5)<4){A.mode='return';A.huntBan=g.t+2.5;}
  }
  if(A.mode==='return'){const h=nearestOwn(e);if(h){tx=h.x;ty=h.y;}}
  if(tx===undefined){tx=g.W/2;ty=g.H/2;}
  let want=Math.atan2(ty-e.y,tx-e.x);
  if(!home)want+=(Math.random()-.5)*g.D.err;
  e.tang=steer(e,want);
}

let touch=null;
function screenToAng(dx,dy){
  const p=G.player;
  project(p.x,p.y,0);const x0=PR.x,y0=PR.y;
  project(p.x+1,p.y,0);const ax=PR.x-x0,ay=PR.y-y0;
  project(p.x,p.y+1,0);const bx=PR.x-x0,by=PR.y-y0;
  const det=ax*by-ay*bx;
  if(Math.abs(det)<1e-3)return Math.atan2(dy,dx);
  return Math.atan2((ax*dy-ay*dx)/det,(dx*by-dy*bx)/det);
}

/* ---------- loop / pause ---------- */
let running=false,last=0,paused=false,fpsE=.016,fpsN=0;
function frame(t){
  if(!running)return;
  const raw=(t-last)/1000,dt=Math.min(.05,raw);last=t;
  if(useGL&&G&&G.state!=='count'&&!paused&&raw<.5){
    fpsE=fpsE*.93+raw*.07;fpsN++;
    if(fpsN>50){
      if(fpsE>.026&&GQ>.6){GQ=Math.max(.6,GQ*.84);fpsN=0;fpsE=.02;resize();}
      else if(fpsE<.0185&&GQ<1&&fpsN>240){GQ=Math.min(1,GQ*1.12);fpsN=0;resize();}
    }
  }
  if(!paused)update(dt);
  if(running&&G)draw(paused?0:dt,t);
  if(running)requestAnimationFrame(frame);
}
function togglePause(force){
  if(!G||(G.state!=='play'&&G.state!=='count'))return;
  paused=force===true?true:!paused;
  $('#pause').classList.toggle('on',paused);
}
function startGame(si,diff){
  ac();resize();
  save.diff=diff;persist();
  G=null;newGame(si,diff);
  prepUniforms(G);glNewGame();flatCv=[];
  paused=false;$('#pause').classList.remove('on');touch=null;
  show('game');
  running=true;last=performance.now();requestAnimationFrame(frame);
}
function stopGame(){running=false;paused=false;$('#pause').classList.remove('on');}

/* ---------- finish & results ---------- */
function unlockedIds(){return HAMS.filter(isOpen).map(h=>h.id).concat(COS.filter(isOpen).map(c=>c.id));}
function finishGame(){
  const g=G,pl=g.player;
  const rank=g.ents.slice().sort((a,b)=>g.cnt[b.id]-g.cnt[a.id]);
  const place=rank.indexOf(pl)+1,p=pct(pl),win=place===1;
  save.plays++;save.kills+=pl.kills;save.bestPct=Math.max(save.bestPct,Math.round(p*10)/10);
  if(win){save.wins++;if(g.diff===2)save.hardWins++;}
  const key=g.si+'_'+g.diff,sb=save.sceneBest[key]||{pct:0,win:false};
  save.sceneBest[key]={pct:Math.max(sb.pct,Math.round(p*10)/10),win:sb.win||win};
  const newScene=g.si+2>save.reach&&g.si+1<SCENES.length;
  save.reach=Math.max(save.reach,g.si+2);
  const nowIds=unlockedIds(),fresh=nowIds.filter(id=>save.seen.indexOf(id)<0);
  save.seen=Array.from(new Set(save.seen.concat(nowIds)));
  persist();stopGame();
  $('#resTitle').textContent=place===1?'第 1 名！':'第 '+place+' 名';
  $('#resSub').textContent=g.S.n+' ・ '+DIFFS[g.diff].n+' ・ 擊倒 '+pl.kills+' 次 ・ 單局最高 '+pl.peak.toFixed(1)+'%'+(newScene?' ・ 解鎖新場景：'+SCENES[g.si+1].n:'');
  $('#resRank').innerHTML=rank.map((e,i)=>`<div class="rk${e===pl?' me':''}"><span class="no">${i+1}</span><span class="dot" style="background:${e.c.fill}"></span><span class="nm">${e.name}</span><span class="pc">${(g.cnt[e.id]/g.playable*100).toFixed(1)}%</span></div>`).join('');
  const nb=$('#resNew');nb.innerHTML='';
  fresh.forEach(id=>{
    const h=HAMS.find(x=>x.id===id),c=COS.find(x=>x.id===id),w=document.createElement('div');
    w.style.cssText='display:flex;align-items:center;gap:6px';
    const cvs=document.createElement('canvas');cvs.width=cvs.height=128;
    cvs.getContext('2d').drawImage(h?getSprite(h.id,'none','f'):getSprite(save.ham,c.id,'f'),0,0);
    w.appendChild(cvs);const s=document.createElement('span');s.innerHTML=(h?h.full:c.name)+' <span class="badge">NEW</span>';w.appendChild(s);nb.appendChild(w);
  });
  $('#resNewCard').style.display=fresh.length?'block':'none';
  lastRun={si:g.si,diff:g.diff};
  show('s-result');
}
let lastRun={si:0,diff:1};

/* ---------- screens ---------- */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  const gm=id==='game';
  cv.style.display=gm?'block':'none';if(glc)glc.style.display=gm&&useGL?'block':'none';
  if(id==='s-menu')renderMenu();
  if(id==='s-scene')renderScenes();
  if(id==='s-coll')renderColl();
}
function paintTo(c,hid,cid){const g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.drawImage(getSprite(hid,cid,'f'),0,0,c.width,c.height);}
function renderMenu(){
  paintTo($('#mascot'),save.ham,save.cos);
  const open=HAMS.filter(isOpen).length,openC=COS.filter(isOpen).length;
  $('#menuStat').innerHTML=`遊玩 <b>${save.plays}</b> 場 ・ 最高佔地 <b>${save.bestPct.toFixed(0)}%</b><br>倉鼠 <b>${open}/${HAMS.length}</b> ・ 造型 <b>${openC}/${COS.length}</b>`+(TEST?'<br>測試模式：全部解鎖':'')+(useGL?'':`<br><small style="font-weight:500;color:#7b7590">簡易畫面（球面畫面無法啟用：${glErr||'未知原因'}）</small>`);
  $('#bSnd').textContent='音效：'+(save.muted?'關':'開');
}
function sceneOpen(i){return TEST||i<save.reach;}
function renderScenes(){
  const d=save.diff;
  document.querySelectorAll('#diffSeg button').forEach(b=>b.classList.toggle('on',+b.dataset.d===d));
  $('#sceneGrid').innerHTML=SCENES.map((S,i)=>{
    const op=sceneOpen(i),b=save.sceneBest[i+'_'+d];
    const info=!op?'完成前一關解鎖':b?`最高 ${b.pct.toFixed(0)}%${b.win?' <span class="win">★第1名</span>':''}`:'尚未挑戰';
    return `<button class="tile${op?'':' lock'}" data-i="${i}" ${op?'':'disabled'}><div class="sw" style="background:linear-gradient(90deg,${S.g[0]} 50%,${S.g[1]} 50%)"><i style="background:${S.wall}"></i></div><div class="no">${i+1}</div><div class="nm">${S.n}</div><small>${info}</small></button>`;
  }).join('');
}
let collTab='ham';
function renderColl(){
  const h=hamById(save.ham),c=cosById(save.cos);
  paintTo($('#prevC'),h.id,c.id);
  $('#prevName').textContent=h.full;$('#prevSub').textContent='造型：'+c.name;
  document.querySelectorAll('#collTabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===collTab));
  const list=collTab==='ham'?HAMS:COS,grid=$('#collGrid');
  grid.innerHTML=list.map(it=>{
    const op=isOpen(it),sel=(collTab==='ham'?save.ham:save.cos)===it.id;
    return `<button class="hc${op?'':' lock'}${sel?' sel':''}" data-id="${it.id}" ${op?'':'disabled'}><canvas width="128" height="128"></canvas><div class="n">${collTab==='ham'?it.full:it.name}</div><small>${op?(sel?'使用中':'已解鎖'):reqText(it)+'<br>'+reqProg(it)}</small></button>`;
  }).join('');
  grid.querySelectorAll('.hc').forEach((el,i)=>{
    const it=list[i];paintTo(el.querySelector('canvas'),collTab==='ham'?it.id:save.ham,collTab==='ham'?save.cos:it.id);
  });
}

/* ---------- wiring ---------- */
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go)show(go.dataset.go);});
$('#bPlay').onclick=()=>{ac();show('s-scene');};
$('#bColl').onclick=()=>show('s-coll');
$('#bSnd').onclick=()=>{save.muted=!save.muted;persist();renderMenu();ac();};
$('#diffSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;save.diff=+b.dataset.d;persist();renderScenes();};
$('#sceneGrid').onclick=e=>{const t=e.target.closest('.tile');if(!t||t.disabled)return;startGame(+t.dataset.i,save.diff);};
$('#collTabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;collTab=b.dataset.t;renderColl();};
$('#collGrid').onclick=e=>{
  const t=e.target.closest('.hc');if(!t||t.disabled)return;
  if(collTab==='ham')save.ham=t.dataset.id;else save.cos=t.dataset.id;
  persist();renderColl();
};
$('#bAgain').onclick=()=>startGame(lastRun.si,lastRun.diff);
$('#bScenes').onclick=()=>show('s-scene');
$('#bMenu').onclick=()=>show('s-menu');
$('#bResume').onclick=()=>togglePause(false);
$('#bRetry').onclick=()=>startGame(G.si,G.diff);
$('#bQuit').onclick=()=>{stopGame();show('s-scene');};
['gesturestart','dblclick'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
useGL=initGL();initDyn();resize();renderMenu();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
